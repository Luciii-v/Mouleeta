# ============================================================
# Mouleeta — GitHub Actions CI/CD Pipeline
# Stack: Next.js 16 + React 19 + TypeScript + Tailwind CSS v4
# Hosting: Vercel (Production) | Domain: Hostinger
# Firebase: Client SDK + Admin SDK
# ============================================================

name: CI / CD — Mouleeta

on:
  # ── Trigger 1: Run lint + type-check + build on every PR to main ──
  pull_request:
    branches:
      - main

  # ── Trigger 2: Deploy to Vercel Production on merge to main ──
  push:
    branches:
      - main

# Cancel any in-progress run for the same branch/PR to avoid duplicate deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # JOB 1 — CI: Lint, Type-Check, and Build
  # Runs on every PR AND every push to main (before deployment)
  # ================================================================
  ci:
    name: 🔍 Lint, Type-Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Step 1: Checkout source code ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Node.js (matches local dev environment) ────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Step 3: Install dependencies (clean & reproducible) ───────
      - name: Install dependencies
        run: npm ci

      # ── Step 4: Lint — ESLint (next/core-web-vitals ruleset) ──────
      - name: Run ESLint
        run: npm run lint
        # If lint fails, the PR cannot be merged. Fix all errors before merging.

      # ── Step 5: TypeScript type-checking (no emit, just validate) ─
      - name: TypeScript type-check
        run: npx tsc --noEmit
        # Catches type errors that ESLint might miss.

      # ── Step 6: Production build test ─────────────────────────────
      # We inject dummy env vars so Next.js doesn't crash at build time.
      # Real secrets are only used during the actual Vercel deployment.
      - name: Production build (compilation check)
        run: npm run build
        env:
          # ── Firebase Client SDK ────────────────────────────────────
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}

          # ── Firebase Admin SDK (base64-encoded service account JSON) ─
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}

          # ── NextAuth ───────────────────────────────────────────────
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          # ── Razorpay ───────────────────────────────────────────────
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}

          # ── Shopify Storefront ─────────────────────────────────────
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_CHECKOUT_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_CHECKOUT_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}

          # ── Shiprocket ─────────────────────────────────────────────
          SHIPROCKET_API_EMAIL: ${{ secrets.SHIPROCKET_API_EMAIL }}
          SHIPROCKET_API_PASSWORD: ${{ secrets.SHIPROCKET_API_PASSWORD }}

          # ── Resend (Email) ─────────────────────────────────────────
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  # ================================================================
  # JOB 2 — CD: Deploy to Vercel Production
  # Only runs after CI passes AND only on a push to main (not PRs)
  # ================================================================
  deploy:
    name: 🚀 Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci  # ← Waits for the CI job to succeed first
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: Production
      url: https://mouleeta.com  # ← Replace with your actual custom domain

    steps:
      # ── Step 1: Checkout source code ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Node.js ────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Step 3: Install Vercel CLI ────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ── Step 4: Sync all env vars from GitHub Secrets → Vercel ──────
      # This guarantees Vercel's build uses the correct values from GitHub
      # rather than whatever is manually set in the Vercel Dashboard.
      - name: Sync env vars to Vercel
        run: |
          sync_env() {
            printf '%s' "$2" | vercel env rm "$1" production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
            printf '%s' "$2" | vercel env add "$1" production --token=${{ secrets.VERCEL_TOKEN }}
          }
          sync_env FIREBASE_SERVICE_ACCOUNT_BASE64        "$FIREBASE_SERVICE_ACCOUNT_BASE64"
          sync_env NEXT_PUBLIC_FIREBASE_API_KEY           "$NEXT_PUBLIC_FIREBASE_API_KEY"
          sync_env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN       "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
          sync_env NEXT_PUBLIC_FIREBASE_PROJECT_ID        "$NEXT_PUBLIC_FIREBASE_PROJECT_ID"
          sync_env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET    "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"
          sync_env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
          sync_env NEXT_PUBLIC_FIREBASE_APP_ID            "$NEXT_PUBLIC_FIREBASE_APP_ID"
          sync_env NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID    "$NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID"
          sync_env NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN       "$NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN"
          sync_env NEXT_PUBLIC_SHOPIFY_CHECKOUT_DOMAIN    "$NEXT_PUBLIC_SHOPIFY_CHECKOUT_DOMAIN"
          sync_env NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN "$NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN"
          sync_env SHOPIFY_API_VERSION                    "$SHOPIFY_API_VERSION"
          sync_env SHOPIFY_CLIENT_ID                      "$SHOPIFY_CLIENT_ID"
          sync_env SHOPIFY_CLIENT_SECRET                  "$SHOPIFY_CLIENT_SECRET"
          sync_env SHOPIFY_ADMIN_ACCESS_TOKEN             "$SHOPIFY_ADMIN_ACCESS_TOKEN"
          sync_env NEXT_PUBLIC_RAZORPAY_KEY_ID            "$NEXT_PUBLIC_RAZORPAY_KEY_ID"
          sync_env RAZORPAY_KEY_SECRET                    "$RAZORPAY_KEY_SECRET"
          sync_env RESEND_API_KEY                         "$RESEND_API_KEY"
          sync_env SHIPROCKET_API_EMAIL                   "$SHIPROCKET_API_EMAIL"
          sync_env SHIPROCKET_API_PASSWORD                "$SHIPROCKET_API_PASSWORD"
          sync_env GOOGLE_CLIENT_ID                       "$GOOGLE_CLIENT_ID"
          sync_env GOOGLE_CLIENT_SECRET                   "$GOOGLE_CLIENT_SECRET"
          sync_env NEXTAUTH_SECRET                        "$NEXTAUTH_SECRET"
          sync_env NEXTAUTH_URL                           "$NEXTAUTH_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_CHECKOUT_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_CHECKOUT_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SHIPROCKET_API_EMAIL: ${{ secrets.SHIPROCKET_API_EMAIL }}
          SHIPROCKET_API_PASSWORD: ${{ secrets.SHIPROCKET_API_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      # ── Step 5: Deploy to Vercel (Vercel builds on their servers) ────
      # CI job already verified the build succeeds. Now let Vercel build
      # cleanly on their infrastructure using the synced env vars above.
      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
